[package]
name = "gege-dic"
version = "1.11.1"
edition = "2021"

[lib]
name = "gege_dic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
arboard = "3"
dirs = "5"
rfd = "0.15"
sha2 = "0.10"
csv = "1"
# Runs the OCR models. The library itself (onnxruntime.dll, pinned in ort-runtime.json) is loaded
# from a file when the OCR is first used, so that a PC that cannot load it loses the screenshot
# OCR and nothing else; the crate downloads nothing and links nothing at build time.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
