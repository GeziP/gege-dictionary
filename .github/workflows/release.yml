name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci
      - run: npm run lint
      # generate_context! validates frontendDist even for Rust unit-test builds.
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 鸽鸽词典 v__VERSION__
          releaseBody: 请查看本版本发布说明并通过应用内更新安全升级。
          releaseDraft: true
          prerelease: false
      - name: Normalize Windows release asset names
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content -Raw -Encoding utf8 src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          $releaseId = $null
          foreach ($release in $releases) {
            if ($release.tag_name -eq "v$version") { $releaseId = $release.id; break }
          }
          if (-not $releaseId) { throw "Draft release v$version was not found" }
          $assets = gh api "repos/$env:GITHUB_REPOSITORY/releases/$releaseId/assets" | ConvertFrom-Json
          foreach ($asset in $assets) {
            if ($asset.name -like "*$version*x64-setup.exe") {
              gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)" `
                -f "name=Gege-Dictionary_${version}_x64-setup.exe" --silent
            } elseif ($asset.name -like "*$version*x64-setup.exe.sig") {
              gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)" `
                -f "name=Gege-Dictionary_${version}_x64-setup.exe.sig" --silent
            }
          }
