name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      # The toolchain is the one rust-toolchain.toml pins, so that CI lints and tests with the
      # compiler the developers use and a new Rust release cannot turn it red by itself.
      - name: Install the Rust toolchain that rust-toolchain.toml pins
        shell: bash
        run: rustup toolchain install
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci
      # ONNX Runtime, which runs the OCR networks, is not in the repository: the Rust build stops
      # without it (build.rs), and the installer carries it. This downloads the version that
      # src-tauri/ort-runtime.json pins and checks it against its SHA-256.
      - name: Fetch ONNX Runtime
        shell: pwsh
        run: ./scripts/fetch-onnxruntime.ps1
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      # generate_context! validates frontendDist even for the Rust lint and unit-test builds.
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
